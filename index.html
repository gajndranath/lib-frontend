<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Security Headers (Note: X-Frame-Options, CSP frame-ancestors, X-Content-Type-Options must be set via HTTP headers, not meta tags) -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="Library Management System - Secure student and admin portal"
    />
    <meta name="application-name" content="Library Management System" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Library System" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/vite.svg" />
    <title>Library Management System</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (
        location.hostname === "localhost" ||
        location.hostname === "127.0.0.1"
      ) {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .getRegistrations()
            .then((registrations) =>
              registrations.forEach((r) => r.unregister()),
            );
        }
        if ("caches" in window) {
          caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Inline script above removes dev service workers and caches -->
  </body>
</html>
